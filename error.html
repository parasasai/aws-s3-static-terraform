<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Parasa Sai Nageswar Goud</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --error-color: #f85149;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .badge {
            background-color: var(--error-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            color: white;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-main);
            margin: 15px 0 25px 0;
        }

        .btn {
            display: inline-block;
            background-color: #21262d;
            color: var(--accent-color);
            border: 1px solid #30363d;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #30363d;
        }

        .footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #30363d;
            padding-top: 20px;
            margin-top: 20px;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>
        <div class="badge">404 Error</div>
        <h1>Requested Page Not Found</h1>
        <p>The path you are looking for does not exist or has been moved from the S3 bucket repository.</p>
        
        <a href="index.html" class="btn">Return Home</a>
        
        <div class="footer">
            Static Bucket Architecture • Managed via Terraform
        </div>
    </div>

</body>
</html>
