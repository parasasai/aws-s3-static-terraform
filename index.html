<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Completed - Parasa Sai Nageswar Goud</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #58a6ff;
            --success-color: #238636;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .badge {
            background-color: var(--success-color);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            color: white;
        }

        .name {
            color: var(--accent-color);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: var(--text-main);
            margin: 15px 0 25px 0;
        }

        .footer {
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid #30363d;
            padding-top: 20px;
            margin-top: 20px;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🚀</div>
        <div class="badge">Deployment Successful</div>
        <h1>Static S3 Bucket Task</h1>
        <p>Successfully completed by <br><span class="name">PARASA SAI NAGESWAR GOUD</span></p>
        
        <div class="footer">
            Completed on: <strong>13 October 2026</strong> via Terraform
        </div>
    </div>

</body>
</html>
